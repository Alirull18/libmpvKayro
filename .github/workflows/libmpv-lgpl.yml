name: libmpv-lgpl

# Builds an LGPL libmpv (libmpv-2.dll) for 64-bit Windows from public sources, checks that no GPL or
# non-free FFmpeg option slipped in, and archives the corresponding source of everything it downloaded.
# Manual only. Nothing here runs on a schedule, and nothing prunes old releases.

on:
  workflow_dispatch:
    inputs:
      toolchain_ref:
        description: "shinchiro/mpv-winbuild-cmake commit or branch (blank = default branch; the exact commit is always recorded)"
        required: false
        default: "bda10a2816ce9908d419b3f4b564227330457e76"
      sources_cutoff:
        description: "Build every source as of this date (ISO 8601). Blank = the toolchain commit's date, so its patches apply"
        required: false
        default: ""
      accept_lgplv3:
        description: "The owner accepts an LGPLv3 FFmpeg (decisions D14/D36). Without it the build is kept but not published"
        required: false
        default: false
        type: boolean
      clean_cache:
        description: "Start from nothing: do not restore the saved build state"
        required: false
        default: false
        type: boolean
      publish:
        description: "Publish a GitHub release from this build"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build libmpv (LGPL, x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/archlinux/archlinux:base-devel
    steps:
      - name: Install dependencies
        shell: bash
        run: |
          sudo echo -e "[multilib]\nInclude = /etc/pacman.d/mirrorlist" | sudo tee -a /etc/pacman.conf >/dev/null
          sudo pacman-key --init
          sudo pacman-key --populate archlinux
          sudo pacman -Syu --noconfirm
          sudo pacman -S --noconfirm --needed git ninja cmake meson clang lld libc++ unzip ragel yasm nasm gperf rst2pdf lib32-gcc-libs lib32-glib2 python-cairo curl wget mimalloc ccache python-pip 7zip shaderc
          sudo python -m pip install --break-system-packages roman
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase true
          git config --global rebase.autoStash true
          git config --global fetch.prune true

      - uses: actions/checkout@v4

      - name: Checkout build toolchain (shinchiro/mpv-winbuild-cmake)
        uses: actions/checkout@v4
        with:
          repository: shinchiro/mpv-winbuild-cmake
          ref: ${{ inputs.toolchain_ref }}
          path: mpv-winbuild-cmake
          fetch-depth: 0

      - name: Prepare
        shell: bash
        run: |
          sed -i '/ccache_conf.in/d' mpv-winbuild-cmake/CMakeLists.txt
          sed -i '/ccache/d' mpv-winbuild-cmake/exec.in

      # A cold build takes over an hour before it reaches the last packages, so the build state is saved
      # even when the run fails and the next run carries on from there. Tick clean_cache to start over.
      - name: Restore saved build state
        if: ${{ inputs.clean_cache != true }}
        uses: actions/cache/restore@v4
        with:
          path: |
            mpv-winbuild-cmake/build64
            mpv-winbuild-cmake/src_packages
            mpv-winbuild-cmake/install_rustup
          key: libmpv-build-${{ github.run_id }}
          restore-keys: |
            libmpv-build-

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          # The whole job output goes into the build-logs artifact, not just the per-package logs.
          mkdir -p logs
          exec > >(tee -a logs/build-full.log) 2>&1
          chmod +x build.sh
          cutoff="${{ inputs.sources_cutoff }}"
          [ -n "$cutoff" ] || cutoff=$(git -C mpv-winbuild-cmake log -1 --format=%cI)
          echo "SOURCES_CUTOFF=$cutoff" | tee -a "$GITHUB_ENV"
          export SOURCES_CUTOFF="$cutoff"
          # A committed sources.lock (a previous release's SOURCES.txt) pins those trees exactly.
          if [ -f sources.lock ]; then export SOURCES_LOCK="$PWD/sources.lock"; fi
          cd mpv-winbuild-cmake
          for patch in ../patch/*.patch ; do
            git am --3way "$patch" || git am --abort
          done
          # Disables every GPL-only and non-free package in FFmpeg and mpv.
          git am --3way ../compile-lgpl-libmpv.patch
          # Local fixes that must apply on top of the LGPL patch (for example dropping a package whose patch broke).
          for patch in ../patch-after-lgpl/*.patch ; do
            git am --3way "$patch"
          done
          bash ../build.sh -t 64 -c gcc -s true

      - name: Save build state
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            mpv-winbuild-cmake/build64
            mpv-winbuild-cmake/src_packages
            mpv-winbuild-cmake/install_rustup
          key: libmpv-build-${{ github.run_id }}

      - name: Collect result and check the licence flags
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cd mpv-winbuild-cmake
          pkg=$(ls release/mpv-dev-lgpl-x86_64-*.7z | head -n1)
          test -n "$pkg"
          cp "$pkg" ../out/
          mkdir -p /tmp/check && 7z x -y -o/tmp/check "$pkg" >/dev/null
          dll=$(find /tmp/check -name 'libmpv-2.dll' | head -n1)
          test -n "$dll"
          # Judged from FFmpeg's own configure command and licence line in the build tree; fails if they are missing.
          bash ../scripts/check-licence.sh build64 "$dll" ../out "${{ inputs.accept_lgplv3 }}"
          (cd /tmp/check && find . -type f -print0 | sort -z | xargs -0 sha256sum) > ../out/PACKAGE-CONTENTS.sha256
          pacman -Q > ../out/host-packages.txt
          dll_bytes=$(stat -c %s "$dll")
          dll_mb=$(awk -v b="$dll_bytes" 'BEGIN { printf "%.2f", b / 1048576 }')
          {
            echo "built_at_utc=$(date -u +%FT%TZ)"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "build_scripts_commit=${GITHUB_SHA}"
            echo "toolchain_repo=https://github.com/shinchiro/mpv-winbuild-cmake"
            echo "toolchain_commit=$(git rev-parse HEAD)"
            echo "sources_cutoff=${SOURCES_CUTOFF}"
            echo "sources_lock=$([ -f ../sources.lock ] && sha256sum ../sources.lock | cut -d' ' -f1 || echo none)"
            echo "ffmpeg_license=$(cut -d: -f2- ../out/ffmpeg-license.txt | xargs)"
            echo "licence_status=$(cat ../out/licence-status.txt)"
            echo "container_image=ghcr.io/archlinux/archlinux:base-devel (host package versions in host-packages.txt)"
            echo "host_gcc=$(gcc --version | head -n1)"
            echo "cross_gcc=$(find build64/install/bin -name '*-w64-mingw32-gcc' -print -quit | xargs -r -I{} {} --version | head -n1)"
            echo "rustc=$(install_rustup/.cargo/bin/rustc --version 2>/dev/null || echo unknown)"
            echo "mpv_commit=$(git -C src_packages/mpv rev-parse HEAD)"
            echo "ffmpeg_commit=$(git -C src_packages/ffmpeg rev-parse HEAD)"
            echo "package=$(basename "$pkg")"
            echo "libmpv_dll_bytes=$dll_bytes"
            echo "libmpv_dll_mb=$dll_mb"
            echo "libmpv_dll_sha256=$(sha256sum "$dll" | cut -d' ' -f1)"
            echo "package_sha256=$(sha256sum "$pkg" | cut -d' ' -f1)"
          } > ../out/BUILD-INFO.txt
          cat ../out/BUILD-INFO.txt
          echo "libmpv-2.dll size: $dll_bytes bytes ($dll_mb MB)"
          {
            echo "### libmpv-2.dll size"
            echo
            echo "| File | Bytes | MB (MiB) |"
            echo "| --- | ---: | ---: |"
            echo "| libmpv-2.dll | $dll_bytes | $dll_mb |"
            echo "| $(basename "$pkg") | $(stat -c %s "$pkg") | $(awk -v b="$(stat -c %s "$pkg")" 'BEGIN { printf "%.2f", b / 1048576 }') |"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Record and archive the corresponding sources
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/archive-sources.sh mpv-winbuild-cmake/src_packages out
          bash scripts/collect-licenses.sh mpv-winbuild-cmake/src_packages out

      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-lgpl
          path: out/
          if-no-files-found: error

      - name: Upload build logs
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p logs
          # logs/build-full.log is already here; add every package log and FFmpeg's config.log.
          find mpv-winbuild-cmake/build64 -type f \( -iname '*-*.log' -o -wholename '*/ffbuild/config.log' \) -print0 2>/dev/null | xargs -0 -r 7z a logs/logs.7z >/dev/null || true
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: build-logs
          path: logs/
          if-no-files-found: ignore

  publish:
    name: Publish release
    needs: build
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: libmpv-lgpl
          path: out
      - name: Create the release (never pruned)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd out
          if [ "$(cat licence-status.txt)" = lgplv3-not-accepted ]; then
            echo "::error::FFmpeg is LGPLv3 and accept_lgplv3 was not ticked (owner decisions D14/D36). Not publishing."
            exit 1
          fi
          mpv_sha=$(grep '^mpv_commit=' BUILD-INFO.txt | cut -d= -f2 | cut -c1-10)
          # The run id keeps every rebuild on a new tag; an existing release is never replaced.
          tag="libmpv-lgpl-$(date -u +%Y-%m-%d)-${mpv_sha}-r${GITHUB_RUN_ID}"
          sha256sum * > SHA256SUMS.txt
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "libmpv LGPL $tag" \
            --notes-file BUILD-INFO.txt ./*
